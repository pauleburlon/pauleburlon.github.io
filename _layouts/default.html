<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <script>
    // Set theme + enable reveal animations before paint to avoid flash
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        if (stored) document.documentElement.setAttribute('data-theme', stored);
      } catch (e) {}
      document.documentElement.classList.add('reveal-ready');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <main class="page{% if page.page_class %} {{ page.page_class }}{% endif %}">
    <div class="top-bar">
      <nav class="lang-switch" aria-label="language switcher">
        {% if page.lang == 'de' %}
          <a href="{{ '/' | relative_url }}" lang="en" hreflang="en">EN</a>
          <span aria-current="true" lang="de">DE</span>
        {% else %}
          <span aria-current="true" lang="en">EN</span>
          <a href="{{ '/de/' | relative_url }}" lang="de" hreflang="de">DE</a>
        {% endif %}
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
    {{ content }}
  </main>
  <footer class="site-footer">
    <a href="{{ '/' | relative_url }}">{{ site.author }}</a>
  </footer>
  <script>
    (function () {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var current = root.getAttribute('data-theme');
        if (!current) {
          current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();

    // Reveal-on-scroll: fade in section headings and content blocks
    (function () {
      var targets = document.querySelectorAll(
        'main > h2, main > .cv-grid, main > .research-thesis, main > .skill-grid'
      );
      if (!targets.length) return;

      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced || !('IntersectionObserver' in window)) {
        targets.forEach(function (el) { el.classList.add('is-visible'); });
        return;
      }

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });

      targets.forEach(function (el) { observer.observe(el); });
    })();

    // Book cursor: a small open book replaces the pointer. It flips a
    // page every few seconds, and sheds little pages while it travels.
    // Fine-pointer devices only; skipped entirely for reduced motion.
    (function () {
      if (!window.matchMedia('(pointer: fine)').matches) return;
      var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (reducedMotion.matches) return;
      // iPadOS reports (pointer: fine) with a trackpad attached but ignores
      // `cursor: none`, which would leave both cursors visible — skip it.
      // (Real Macs have maxTouchPoints 0, so they pass this guard.)
      if (navigator.maxTouchPoints > 1 && /iPad|Macintosh/.test(navigator.userAgent)) return;

      var el = document.createElement('div');
      el.className = 'book-cursor';
      el.setAttribute('aria-hidden', 'true');
      // Right-page spread + text lines; the left page reuses it mirrored
      // about the spine (x=16), and the flipping page is an exact copy so
      // it hides perfectly on whichever side it rests.
      var page =
        '<path class="page" d="M16 11 C 19.6 9.7, 24.2 9.5, 27.6 10.7 L 27.6 21.4 C 24.2 20.3, 19.6 20.5, 16 21.8 Z"/>' +
        '<path class="text-line" d="M18 12.9 C 20.5 12.2, 23.3 12.1, 25.7 12.7"/>' +
        '<path class="text-line" d="M18 15.2 C 20.5 14.5, 23.3 14.4, 25.7 15"/>' +
        '<path class="text-line" d="M18 17.5 C 20.5 16.8, 23.3 16.7, 25.7 17.3"/>';
      el.innerHTML =
        '<div class="book-inner">' +
          '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
            '<path class="cover" d="M16 9.8 C 20 8.2, 25.6 8, 29.4 9.4 L 29.4 22.8 C 25.6 21.4, 20 21.6, 16 23.4 C 12 21.6, 6.4 21.4, 2.6 22.8 L 2.6 9.4 C 6.4 8, 12 8.2, 16 9.8 Z"/>' +
            '<g>' + page + '</g>' +
            '<g transform="matrix(-1 0 0 1 32 0)">' + page + '</g>' +
            '<g class="flip">' + page + '</g>' +
          '</svg>' +
        '</div>';
      document.body.appendChild(el);
      var root = document.documentElement;
      var disabled = false;

      // Pages that fly out while the book moves
      var canFly = window.Element && Element.prototype.animate;
      var flakes = 0, travel = 0, lastX = null, lastY = null;

      function spawnFlake(x, y, dx, dy) {
        if (!canFly || flakes >= 12) return;
        flakes++;
        var f = document.createElement('div');
        f.className = 'page-flake';
        f.setAttribute('aria-hidden', 'true');
        f.style.left = x + 'px';
        f.style.top = y + 'px';
        document.body.appendChild(f);
        // Drift opposite to travel, with sideways spread, a downward
        // settle, and a random tumble — like a sheet slipping out.
        var mag = Math.hypot(dx, dy) || 1;
        var ux = -dx / mag, uy = -dy / mag;
        var side = (Math.random() - 0.5) * 46;
        var dist = 24 + Math.random() * 26;
        var tx = ux * dist - uy * side;
        var ty = uy * dist + ux * side + 22 + Math.random() * 10;
        var rot = (Math.random() - 0.5) * 260;
        var life = 650 + Math.random() * 350;
        f.animate(
          [
            { transform: 'translate(0,0) rotate(0deg)', opacity: 0.85 },
            { transform: 'translate(' + tx + 'px,' + ty + 'px) rotate(' + rot + 'deg)', opacity: 0 }
          ],
          { duration: life, easing: 'cubic-bezier(0.25, 0.6, 0.35, 1)', fill: 'forwards' }
        );
        // Deterministic cleanup — onfinish can be missed (paused/seeked
        // animations, devtools), which would strand flakes and jam the cap.
        setTimeout(function () {
          f.remove();
          flakes--;
        }, life + 100);
      }

      // Position from mouse-type pointers only, so taps on hybrid
      // touch+mouse devices never teleport or strand the book.
      // The native cursor is hidden only once the book is actually
      // visible at a known position — never before.
      document.addEventListener('pointermove', function (e) {
        if (disabled || e.pointerType !== 'mouse') return;
        el.style.transform =
          'translate3d(' + (e.clientX - 13) + 'px,' + (e.clientY - 13) + 'px,0)';
        el.classList.add('is-active');
        root.classList.add('has-book');
        if (lastX !== null) {
          var dx = e.clientX - lastX, dy = e.clientY - lastY;
          travel += Math.hypot(dx, dy);
          if (travel > 80) {
            travel = 0;
            spawnFlake(e.clientX, e.clientY, dx, dy);
          }
        }
        lastX = e.clientX;
        lastY = e.clientY;
      }, { passive: true });

      // Touch interaction: put the book away and restore native behaviour
      document.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'touch') {
          el.classList.remove('is-active');
          root.classList.remove('has-book');
          lastX = lastY = null;
        }
      }, { passive: true });

      // Hide when the pointer leaves the window (mouse-only event)
      document.addEventListener('mouseleave', function () {
        el.classList.remove('is-active');
      });

      // Grow + riffle pages over clickable things
      document.addEventListener('pointerover', function (e) {
        if (disabled || e.pointerType !== 'mouse') return;
        var t = e.target;
        el.classList.toggle('on-link', !!(t.closest && t.closest('a, button')));
      });

      // Kill switch: honor reduced-motion turned on mid-session
      function stop() {
        disabled = true;
        root.classList.remove('has-book');
        el.remove();
      }
      if (reducedMotion.addEventListener) {
        reducedMotion.addEventListener('change', function (ev) {
          if (ev.matches) stop();
        });
      }
    })();

    // Scroll-spy: highlight side-nav link for the section in view
    (function () {
      var links = document.querySelectorAll('.side-nav a');
      if (!links.length || !('IntersectionObserver' in window)) return;

      var headings = document.querySelectorAll('main h2[id]');
      if (!headings.length) return;

      var linkById = {};
      links.forEach(function (link) {
        var href = link.getAttribute('href') || '';
        if (href.charAt(0) === '#') linkById[href.slice(1)] = link;
      });

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var link = linkById[entry.target.id];
          if (!link) return;
          if (entry.isIntersecting) {
            links.forEach(function (l) { l.classList.remove('active'); });
            link.classList.add('active');
          }
        });
      }, { rootMargin: '-40% 0px -55% 0px' });

      headings.forEach(function (h) { observer.observe(h); });
    })();
  </script>
</body>
</html>
