<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <main class="page{% if page.page_class %} {{ page.page_class }}{% endif %}">
    <nav class="lang-switch" aria-label="language switcher">
      {% if page.lang == 'de' %}
        <a href="{{ '/' | relative_url }}" lang="en" hreflang="en">EN</a>
        <span aria-current="true" lang="de">DE</span>
      {% else %}
        <span aria-current="true" lang="en">EN</span>
        <a href="{{ '/de/' | relative_url }}" lang="de" hreflang="de">DE</a>
      {% endif %}
    </nav>
    {{ content }}
  </main>
  <footer class="site-footer">
    <a href="{{ '/' | relative_url }}">{{ site.author }}</a>
  </footer>
</body>
</html>
