<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Paul Burlon — Site Redesign</title>
<meta name="viewport" content="width=1400" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0c; font-family: "EB Garamond", Georgia, serif; }
  body { min-height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="variant-refined.jsx"></script>
<script type="text/babel" src="variant-editorial.jsx"></script>
<script type="text/babel" src="variant-quant.jsx"></script>

<script type="text/babel" data-presets="env,react">
  const { DesignCanvas, DCSection, DCArtboard, TweaksPanel, TweakSection, TweakColor, useTweaks } = window;

  // Curated palettes — each defines the full token set the Refined variant
  // reads via CSS custom properties.
  const PALETTES = {
    terracotta: { bg: "#faf5ea", bgSoft: "#f3ecdc", text: "#2a2622", muted: "#6e655c", faint: "#9b9082", rule: "#e2d8c4", accent: "#7a3b2f", accentSoft: "#b58579" },
    sage:       { bg: "#f4f3ec", bgSoft: "#eae9df", text: "#1f241f", muted: "#5e6b5d", faint: "#9aa39a", rule: "#d3d8cf", accent: "#3a5a3a", accentSoft: "#8aa489" },
    indigo:     { bg: "#f6f5f0", bgSoft: "#ebe9e1", text: "#1c1d25", muted: "#5d6072", faint: "#9b9da9", rule: "#dad9d0", accent: "#2a4a8a", accentSoft: "#7a8cbf" },
    bone:       { bg: "#f1ece2", bgSoft: "#e6dfd0", text: "#231916", muted: "#6c5b54", faint: "#a39085", rule: "#d8cdb8", accent: "#5e1c14", accentSoft: "#a76b62" },
    slate:      { bg: "#f4f3f1", bgSoft: "#e9e7e3", text: "#1d2024", muted: "#5b6168", faint: "#9aa0a8", rule: "#d9d6d1", accent: "#2f4858", accentSoft: "#7a8a98" },
    noir:       { bg: "#1a1714", bgSoft: "#231f1b", text: "#f0e9da", muted: "#a99e8c", faint: "#6e6457", rule: "#3a342d", accent: "#d97757", accentSoft: "#9c5742" },
  };

  // Each chip = palette[0] hero (accent) + palette[1..3] supporting swatches.
  const PALETTE_OPTIONS = [
    ["#7a3b2f", "#faf5ea", "#2a2622", "#e2d8c4"],
    ["#3a5a3a", "#f4f3ec", "#1f241f", "#d3d8cf"],
    ["#2a4a8a", "#f6f5f0", "#1c1d25", "#dad9d0"],
    ["#5e1c14", "#f1ece2", "#231916", "#d8cdb8"],
    ["#2f4858", "#f4f3f1", "#1d2024", "#d9d6d1"],
    ["#d97757", "#1a1714", "#f0e9da", "#3a342d"],
  ];
  const PALETTE_KEYS = Object.keys(PALETTES);

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "paletteIdx": 0
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const paletteKey = PALETTE_KEYS[t.paletteIdx] || PALETTE_KEYS[0];
    const palette = PALETTES[paletteKey];
    const selected = PALETTE_OPTIONS[t.paletteIdx] || PALETTE_OPTIONS[0];

    const handlePalette = (arr) => {
      const idx = PALETTE_OPTIONS.findIndex(
        (p) => JSON.stringify(p) === JSON.stringify(arr)
      );
      if (idx >= 0) setTweak("paletteIdx", idx);
    };

    return (
      <>
        <DesignCanvas
          title="Paul Enno Burlon — Site Redesign"
          subtitle="V1 is the working direction · color via Tweaks"
        >
          <DCSection id="main" title="Working direction">
            <DCArtboard
              id="refined"
              label={`V1 · Refined — ${paletteKey}`}
              width={1280}
              height={3320}
            >
              <window.RefinedVariant palette={palette} />
            </DCArtboard>
          </DCSection>
          <DCSection id="explorations" title="Earlier explorations">
            <DCArtboard
              id="editorial"
              label="V2 · Editorial — magazine layout"
              width={1280}
              height={3650}
            >
              <window.EditorialVariant />
            </DCArtboard>
            <DCArtboard
              id="quant"
              label="V3 · Quant — data-forward"
              width={1280}
              height={3540}
            >
              <window.QuantVariant />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel title="Tweaks · V1">
          <TweakSection label="Palette" />
          <TweakColor
            label="Color scheme"
            value={selected}
            options={PALETTE_OPTIONS}
            onChange={handlePalette}
          />
          <div style={{
            fontSize: 10.5, color: "rgba(41,38,27,.55)", lineHeight: 1.5,
            padding: "4px 2px 0", fontStyle: "italic",
          }}>
            Current: <strong style={{ color: "rgba(41,38,27,.85)" }}>{paletteKey}</strong>.
            Applies to the “Working direction” artboard only.
          </div>
        </TweaksPanel>
      </>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>
</body>
</html>
